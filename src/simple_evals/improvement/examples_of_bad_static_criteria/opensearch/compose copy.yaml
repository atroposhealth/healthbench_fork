services:
  opensearch_server:
    container_name: opensearch_server
    image: opensearchproject/opensearch:3
    ports:
    - 9200:9200
    - 9600:9600
    environment:
    - discovery.type=single-node
    - OPENSEARCH_INITIAL_ADMIN_PASSWORD=SomeThing13876^&*
    - node.name=opensearch_server
    - discovery.seed_hosts=opensearch_server
    volumes:
    - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    networks:
    - opensearch-net

  ui:
    image: opensearchproject/opensearch-dashboards:2
    ports:
    - 5601:5601
    networks:
    - opensearch-net
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch_server:9200"]'

volumes:
  opensearch-data:

networks:
  opensearch-net: